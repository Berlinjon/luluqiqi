<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef8ff">
<title>听句子选图片</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  :root {
    --bg: #f7fbff;
    --surface: #ffffff;
    --ink: #172033;
    --muted: #6a7688;
    --line: #dbe8ef;
    --blue: #287ec7;
    --blue-soft: #dff1ff;
    --green: #2f9b6f;
    --green-soft: #e3f7ed;
    --coral: #f46f5d;
    --sun: #ffd36a;
    --shadow: 0 18px 44px rgba(39, 86, 123, .14);
    --radius: 8px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      linear-gradient(180deg, #eef8ff 0%, #f9fcff 44%, #f5fbf7 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    width: min(430px, 100%);
    min-height: 100svh;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 14px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .learn-toolbar {
    display: none;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 8px;
    margin: -4px -4px 0;
    border-radius: var(--radius);
    background: rgba(217, 240, 255, .78);
    border: 1px solid rgba(173, 218, 241, .78);
  }
  .topbar.learning .brand,
  .topbar.learning #parentBtn { display: none; }
  .topbar.learning .learn-toolbar {
    display: flex;
    flex: 1;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand strong {
    font-size: 1.3rem;
    line-height: 1.1;
    letter-spacing: 0;
  }
  .brand span, .mini {
    color: var(--muted);
    font-weight: 800;
    font-size: .78rem;
  }
  .icon-btn, .text-btn {
    height: 42px;
    min-width: 42px;
    display: inline-grid;
    place-items: center;
    border-radius: var(--radius);
    background: rgba(255,255,255,.72);
    border: 1px solid rgba(188, 214, 226, .72);
    box-shadow: 0 8px 24px rgba(39, 86, 123, .08);
    font-weight: 900;
  }
  .text-btn { padding: 0 14px; }
  .tool-btn, .tool-pill, .tool-select {
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 12px;
    border-radius: var(--radius);
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(188, 214, 226, .9);
    box-shadow: 0 8px 20px rgba(39, 86, 123, .08);
    color: #163766;
    font-weight: 1000;
    font-size: .82rem;
    white-space: nowrap;
  }
  .tool-btn.icon-only {
    width: 38px;
    padding: 0;
    color: var(--blue);
  }
  .tool-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .tool-pill.level {
    background: linear-gradient(180deg, #5eaaef, #2f86db);
    color: #fff;
    border-color: transparent;
  }
  .tool-pill.progress-pill, .tool-pill.star-pill {
    margin-left: auto;
    min-width: 70px;
    font-size: 1rem;
  }
  .tool-pill.star-pill { margin-left: 0; }
  .tool-select {
    appearance: none;
    color: #163766;
    padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, #2864a0 50%), linear-gradient(135deg, #2864a0 50%, transparent 50%);
    background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  .home.active {
    min-height: calc(100svh - 92px);
    display: grid;
    align-content: center;
    gap: 18px;
  }
  .kid-grid, .lesson-list {
    display: grid;
    gap: 12px;
  }
  .kid-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .route-summary {
    display: grid;
    gap: 10px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: rgba(255,255,255,.72);
  }
  .route-summary-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }
  .route-summary-head strong {
    font-size: 1.08rem;
    line-height: 1.2;
  }
  .route-summary-head span, .route-next {
    color: var(--muted);
    font-size: .8rem;
    font-weight: 900;
    line-height: 1.35;
  }
  .route-next {
    padding: 10px;
    border-radius: var(--radius);
    background: #f6fbff;
    border: 1px solid #e4f0f7;
  }
  .route-group {
    display: grid;
    gap: 8px;
  }
  .route-group-title {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 4px 2px 0;
    color: #163766;
    font-weight: 1000;
  }
  .route-group-title span {
    color: var(--muted);
    font-size: .76rem;
    font-weight: 900;
  }
  .kid-card, .lesson-card, .parent-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .kid-card {
    position: relative;
    min-height: 136px;
    padding: 14px;
    text-align: left;
    display: grid;
    align-content: space-between;
    gap: 16px;
    transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
  }
  .kid-card.active {
    background: #f0f7ff;
    border-color: #4c9ee6;
    box-shadow: 0 18px 44px rgba(40, 126, 199, .22);
  }
  .kid-card.active::after {
    content: "✓";
    position: absolute;
    top: 9px;
    right: 9px;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: #287ec7;
    color: #fff;
    font-size: .9rem;
    font-weight: 1000;
  }
  .kid-face {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--blue-soft);
    font-size: 2rem;
  }
  .kid-card:nth-child(2) .kid-face { background: var(--green-soft); }
  .kid-card:nth-child(3) .kid-face { background: #fff2d8; }
  .kid-card strong, .lesson-card strong {
    display: block;
    font-size: 1.24rem;
    line-height: 1.2;
  }
  .lesson-card {
    width: 100%;
    min-height: 104px;
    padding: 16px;
    text-align: left;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .lesson-card span {
    display: block;
    margin-top: 6px;
    color: var(--muted);
    font-size: .82rem;
    font-weight: 800;
    line-height: 1.45;
  }
  .lesson-badge {
    width: 54px;
    height: 54px;
    display: grid;
    place-items: center;
    border-radius: var(--radius);
    background: var(--blue-soft);
    color: var(--blue);
    font-weight: 1000;
  }
  .lesson-card.current {
    border-color: #8ec8ef;
    background: #f7fcff;
  }
  .lesson-card.done .lesson-badge {
    background: var(--green-soft);
    color: var(--green);
  }
  .lesson-card small {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    min-height: 22px;
    margin-bottom: 8px;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--blue-soft);
    color: #1f5f8d;
    font-size: .7rem;
    font-weight: 1000;
    line-height: 1;
  }

  .learn.active {
    min-height: calc(100svh - 92px);
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    gap: 14px;
  }
  .progress-row {
    display: grid;
    gap: 8px;
  }
  .progress-meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-weight: 900;
  }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #dfeef7;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--green), var(--blue));
    transition: width .22s ease;
  }
  .listen-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    display: grid;
    justify-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .prompt-panel {
    display: none;
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px dashed #bdd3e2;
    background: #f7fcff;
    color: #163766;
    font-weight: 900;
    line-height: 1.45;
    text-align: center;
  }
  .prompt-panel.visible { display: grid; gap: 4px; }
  .prompt-panel .zh { color: var(--muted); font-size: .86rem; }
  .play-btn {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: white;
    background: radial-gradient(circle at 35% 25%, #6bb9ef, var(--blue));
    box-shadow: 0 18px 34px rgba(40,126,199,.28);
  }
  .play-btn.waiting {
    opacity: .72;
    cursor: wait;
    box-shadow: 0 12px 24px rgba(40,126,199,.18);
  }
  .play-btn:disabled {
    pointer-events: none;
  }
  .play-btn svg { width: 42px; height: 42px; margin-left: 5px; fill: currentColor; }
  .wave {
    height: 34px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .wave i {
    display: block;
    width: 6px;
    border-radius: 999px;
    background: #88bee5;
    animation: pulse 1.05s ease-in-out infinite;
  }
  .wave i:nth-child(1){height:12px;animation-delay:.05s}
  .wave i:nth-child(2){height:24px;animation-delay:.12s}
  .wave i:nth-child(3){height:30px;animation-delay:.2s}
  .wave i:nth-child(4){height:18px;animation-delay:.28s}
  .wave i:nth-child(5){height:28px;animation-delay:.36s}
  .wave i:nth-child(6){height:14px;animation-delay:.44s}
  .wave.idle i { animation-play-state: paused; opacity: .62; }
  @keyframes pulse { 0%,100%{transform:scaleY(.72)} 50%{transform:scaleY(1.15)} }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-content: start;
  }
  .choice {
    min-height: 168px;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 10px 26px rgba(39,86,123,.1);
    overflow: hidden;
    transition: transform .16s ease, border-color .16s ease, background .16s ease;
  }
  .choice:active { transform: scale(.98); }
  .choices.mode-2 .choice {
    min-height: 240px;
  }
  .choice.correct {
    border-color: var(--green);
    background: var(--green-soft);
  }
  .choice.wrong {
    border-color: var(--coral);
    background: #fff0ed;
    animation: shake .24s ease;
  }
  .choice-img {
    width: 100%;
    height: 100%;
    min-height: 164px;
    object-fit: cover;
    display: block;
    background: #f7fbff;
  }
  .choices.mode-2 .choice-img {
    width: 100%;
    min-height: 236px;
    object-fit: cover;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    33% { transform: translateX(-5px); }
    66% { transform: translateX(5px); }
  }
  .scene {
    height: 100%;
    min-height: 164px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--sky, #dff1ff) 0 62%, var(--ground, #dff4df) 62% 100%);
  }
  .choices.mode-2 .scene {
    min-height: 236px;
  }
  .scene::before {
    content: "";
    position: absolute;
    inset: 12px 12px auto auto;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--sun);
    box-shadow: 0 0 0 9px rgba(255,211,106,.18);
  }
  .scene .main {
    position: absolute;
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
    font-size: 4rem;
    filter: drop-shadow(0 10px 10px rgba(45,84,102,.16));
  }
  .scene .sub {
    position: absolute;
    left: 18px;
    bottom: 16px;
    font-size: 2.1rem;
  }
  .scene .sub.right { left: auto; right: 18px; }
  .scene .shape {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.7);
  }
  .scene .shape.one { width: 52px; height: 18px; left: 16px; top: 24px; }
  .scene .shape.two { width: 38px; height: 14px; left: 70px; top: 36px; }
  .scene.homey { --sky:#f5ecff; --ground:#efe5d6; }
  .scene.food { --sky:#fff4dc; --ground:#e5f5e6; }
  .scene.water { --sky:#dff6ff; --ground:#bfe8fa; }
  .scene.night { --sky:#dce7ff; --ground:#dae7dc; }
  .scene.school { --sky:#e8f3ff; --ground:#f6e3ba; }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .action-row.three-actions {
    grid-template-columns: 1fr 1fr 1fr;
  }
  .auto-play-toggle.active {
    border-color: #9fd2f3;
    background: #eef8ff;
    color: #175a93;
  }
  .primary, .secondary {
    height: 48px;
    border-radius: var(--radius);
    font-weight: 1000;
  }
  .primary { color: white; background: var(--green); }
  .secondary { color: var(--ink); background: #e9f2f7; }

  .complete.active {
    min-height: calc(100svh - 92px);
    display: grid;
    align-content: center;
    gap: 14px;
  }
  .parent.active {
    min-height: calc(100svh - 92px);
    display: grid;
    align-content: start;
    gap: 14px;
  }
  .result {
    padding: 22px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .result .big { font-size: 4rem; line-height: 1; margin-bottom: 12px; }
  .result h2 { margin: 0 0 8px; font-size: 1.75rem; }
  .result p { margin: 0; color: var(--muted); font-weight: 800; line-height: 1.6; }
  .result-meta {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 10px;
  }
  .result-chip {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 3px 9px;
    border-radius: 7px;
    background: var(--blue-soft);
    color: #1f5f8d;
    font-size: .76rem;
    font-weight: 1000;
    line-height: 1;
  }
  .result-chip.starter {
    color: #1f6a4c;
    background: var(--green-soft);
  }
  .result-feedback {
    margin-top: 8px !important;
    color: #163766 !important;
    font-weight: 1000 !important;
  }
  .parent-panel {
    padding: 16px;
    display: grid;
    gap: 12px;
  }
  .parent-header {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 12px;
  }
  .parent-header h2 {
    margin: 0;
    font-size: 1.25rem;
    line-height: 1.2;
  }
  .parent-header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: .84rem;
    font-weight: 800;
    line-height: 1.45;
  }
  .parent-summary {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .summary-tile, .kid-report, .mistake-item {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #f8fcff;
  }
  .summary-tile {
    min-height: 72px;
    padding: 10px;
    display: grid;
    align-content: center;
    gap: 4px;
  }
  .summary-tile strong {
    font-size: 1.25rem;
    line-height: 1;
  }
  .summary-tile span, .kid-report span, .mistake-item span {
    color: var(--muted);
    font-size: .78rem;
    font-weight: 900;
    line-height: 1.35;
  }
  .kid-report {
    padding: 12px;
    display: grid;
    gap: 10px;
  }
  .kid-report-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-weight: 1000;
  }
  .kid-report-head strong {
    font-size: 1.06rem;
  }
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .metric {
    padding: 8px;
    border-radius: var(--radius);
    background: #fff;
    border: 1px solid #e6f0f6;
  }
  .metric strong {
    display: block;
    font-size: 1rem;
    line-height: 1.15;
  }
  .stage-progress {
    display: grid;
    gap: 8px;
  }
  .stage-row {
    display: grid;
    grid-template-columns: minmax(96px, 1.15fr) minmax(96px, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 10px;
    border-radius: var(--radius);
    background: #fff;
    border: 1px solid #e6f0f6;
  }
  .stage-copy {
    display: grid;
    gap: 2px;
    min-width: 0;
  }
  .stage-copy strong {
    color: #163766;
    font-size: .9rem;
    line-height: 1.2;
  }
  .stage-copy span {
    color: var(--muted);
    font-size: .72rem;
    font-weight: 900;
    line-height: 1.25;
  }
  .stage-bar {
    min-width: 70px;
    height: 9px;
    border-radius: 999px;
    overflow: hidden;
    background: #e7f0f6;
  }
  .stage-fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--green), var(--blue));
  }
  .stage-count {
    min-width: 32px;
    color: #163766;
    font-weight: 1000;
    font-size: .82rem;
    text-align: right;
  }
  .parent-section-title {
    margin: 4px 0 0;
    color: #163766;
    font-weight: 1000;
  }
  .mistake-list {
    display: grid;
    gap: 8px;
  }
  .mistake-item {
    padding: 10px;
    display: grid;
    gap: 4px;
  }
  .mistake-item strong {
    line-height: 1.35;
  }
  .mistake-title {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .mistake-tag {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: .7rem;
    font-weight: 1000;
    line-height: 1;
    white-space: nowrap;
  }
  .mistake-tag.tag-l1 {
    color: #1f6a4c;
    background: var(--green-soft);
  }
  .mistake-tag.tag-l2 {
    color: #1f5f8d;
    background: var(--blue-soft);
  }
  .mistake-tag.tag-old {
    color: #65717f;
    background: #eef2f5;
  }
  .empty-note {
    padding: 12px;
    border-radius: var(--radius);
    background: var(--green-soft);
    color: #1f6a4c;
    font-weight: 900;
    line-height: 1.45;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-weight: 900;
  }
  .stat-row:last-child { border-bottom: 0; }
  .stat-row span { color: var(--muted); }
  .hidden { display: none !important; }

  @media (min-width: 760px) {
    body { display: grid; place-items: center; padding: 28px; }
    .app {
      min-height: 844px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.54);
      box-shadow: 0 30px 80px rgba(20, 63, 98, .16);
    }
  }
  @media (max-width: 390px) {
    .app { padding-left: 10px; padding-right: 10px; }
    .kid-grid { grid-template-columns: 1fr; }
    .parent-summary, .metric-grid { grid-template-columns: 1fr; }
    .tool-btn, .tool-pill, .tool-select { font-size: .76rem; padding-left: 9px; padding-right: 9px; }
    .tool-pill.progress-pill { margin-left: 0; }
    .choices.mode-2 .choice { min-height: 210px; }
    .choices.mode-2 .choice-img, .choices.mode-2 .scene { min-height: 206px; }
    .route-summary-head, .route-group-title { align-items: flex-start; flex-direction: column; }
    .stage-row { grid-template-columns: 1fr auto; }
    .stage-bar { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <strong id="screenTitle">听句子选图片</strong>
      <span id="screenSub">Lulu</span>
    </div>
    <button class="text-btn" id="parentBtn" type="button">家长</button>
    <div class="learn-toolbar" id="learnToolbar">
      <button class="tool-btn icon-only" id="learnBackBtn" type="button" aria-label="返回">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.7 6.3a1 1 0 0 1 0 1.4L10.42 12l4.3 4.3a1 1 0 1 1-1.42 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.42 0Z"/></svg>
      </button>
      <span class="tool-pill level" id="levelPill">★ Level 1</span>
      <button class="tool-btn" id="englishHintBtn" type="button">英文提示：关</button>
      <button class="tool-btn" id="chineseHintBtn" type="button">中文提示：关</button>
      <select class="tool-select" id="speedSelect" aria-label="语速">
        <option value="0.68">慢速</option>
        <option value="0.82" selected>正常</option>
        <option value="1">快速</option>
      </select>
      <span class="tool-pill progress-pill" id="toolbarProgress">1/15</span>
      <span class="tool-pill star-pill" id="starPill">★ 0</span>
    </div>
  </header>

  <section class="screen home active" id="homeScreen">
    <div class="kid-grid" id="kidGrid"></div>
    <div class="lesson-list" id="lessonList"></div>
  </section>

  <section class="screen learn" id="learnScreen">
    <div class="progress-row">
      <div class="progress-meta">
        <span id="lessonTitle">Animals 1</span>
        <span id="progressText">1/15</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="listen-panel">
      <button class="play-btn" id="playBtn" type="button" aria-label="播放">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 9.5c0-2.2 2.4-3.6 4.3-2.4l21 13.2c1.7 1.1 1.7 3.5 0 4.6l-21 13.2c-1.9 1.2-4.3-.2-4.3-2.4V9.5z"/></svg>
      </button>
      <div class="wave idle" id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="prompt-panel" id="promptPanel">
        <div id="englishPrompt"></div>
        <div class="zh" id="chinesePrompt"></div>
      </div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="action-row three-actions">
      <button class="secondary auto-play-toggle active" id="autoPlayBtn" type="button">自动播放：开</button>
      <button class="secondary" id="replayBtn" type="button">重听</button>
      <button class="secondary" id="exitBtn" type="button">退出</button>
    </div>
  </section>

  <section class="screen complete" id="completeScreen">
    <div class="result">
      <div class="big">✓</div>
      <h2>完成一关</h2>
      <div class="result-meta" id="completeMeta"></div>
      <p id="completeText">今天听懂了 15 句话。</p>
      <p class="result-feedback" id="completeFeedback">继续保持。</p>
    </div>
    <button class="primary hidden" id="retryLessonBtn" type="button">再玩一次</button>
    <button class="primary" id="nextLessonBtn" type="button">下一关</button>
    <button class="secondary" id="homeBtn" type="button">回首页</button>
  </section>

  <section class="screen parent" id="parentScreen">
    <div class="parent-panel" id="parentStats"></div>
    <button class="secondary" id="parentBackBtn" type="button">返回</button>
  </section>
</main>

<script src="./src/course-data.js"></script>
<script>
(() => {
  const courseData = window.ENGLISH_LISTENING_DATA || {};
  const {
    KIDS = [],
    GENERATED_IMAGES = {},
    VOICE_PROFILES = {},
    DEFAULT_VOICE_PROFILE = 'ava',
    VISUALS = {},
    LESSONS = []
  } = courseData;
  const CONFIG = {
    AUTO_PLAY_DELAY: 900,
    NEXT_QUESTION_DELAY: 850,
    NEXT_AUDIO_DELAY: 650
  };
  let currentAudio = null;
  let autoPlayTimer = null;
  let advanceTimer = null;

  const state = {
    kid: 'lulu',
    lessonIndex: 0,
    itemIndex: 0,
    locked: false,
    lastScreen: 'home',
    englishHint: false,
    chineseHint: false,
    speed: 0.82,
    autoPlay: true,
    sessionErrors: new Set()
  };

  const $ = id => document.getElementById(id);
  const screens = ['homeScreen','learnScreen','completeScreen','parentScreen'];
  const storageKey = suffix => `englishListening.${suffix}`;
  const readJSON = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch(e) { return fallback; }
  };
  const writeJSON = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
  };
  let voicesReady = false;
  const progress = () => readJSON(storageKey('progress'), {});
  const mistakes = () => readJSON(storageKey('mistakes'), []);
  const stars = () => readJSON(storageKey('stars'), {});
  state.autoPlay = readJSON(storageKey('autoPlay'), true) !== false;

  function show(screen, title = '听句子选图片') {
    screens.forEach(id => $(id).classList.toggle('active', id === screen));
    $('screenTitle').textContent = title;
    $('screenSub').textContent = KIDS.find(k => k.id === state.kid)?.name || 'Lulu';
    $('parentBtn').classList.toggle('hidden', screen === 'learnScreen');
    document.querySelector('.topbar').classList.toggle('learning', screen === 'learnScreen');
    resetScroll();
  }

  function resetScroll() {
    try {
      window.scrollTo({ top: 0, behavior: 'instant' });
    } catch(e) {
      window.scrollTo(0, 0);
    }
  }

  function clearAutoPlayTimer() {
    if (autoPlayTimer) {
      clearTimeout(autoPlayTimer);
      autoPlayTimer = null;
    }
    setAutoPlayWaiting(false);
  }

  function clearAdvanceTimer() {
    if (advanceTimer) {
      clearTimeout(advanceTimer);
      advanceTimer = null;
    }
  }

  function stopCurrentAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    $('wave').classList.add('idle');
  }

  function stopPracticeFlow() {
    clearAutoPlayTimer();
    clearAdvanceTimer();
    stopCurrentAudio();
  }

  function setAutoPlayWaiting(waiting) {
    const btn = $('playBtn');
    btn.classList.toggle('waiting', waiting);
    btn.disabled = waiting;
    btn.setAttribute('aria-busy', waiting ? 'true' : 'false');
  }

  function updateAutoPlayControl() {
    $('autoPlayBtn').textContent = `自动播放：${state.autoPlay ? '开' : '关'}`;
    $('autoPlayBtn').classList.toggle('active', state.autoPlay);
  }

  function scheduleAutoPlay(delayOverride) {
    clearAutoPlayTimer();
    updateAutoPlayControl();
    if (!state.autoPlay) return;

    setAutoPlayWaiting(true);
    const lesson = LESSONS[state.lessonIndex];
    const delay = Number(delayOverride ?? lesson.autoPlayDelay) || CONFIG.AUTO_PLAY_DELAY;
    autoPlayTimer = setTimeout(() => {
      autoPlayTimer = null;
      setAutoPlayWaiting(false);
      if ($('learnScreen').classList.contains('active')) playSentence();
    }, delay);
  }

  function renderHome() {
    const completed = completedLessonIds(state.kid);
    const nextIndex = nextLessonIndexForKid(state.kid);
    $('kidGrid').innerHTML = KIDS.map(k => `
      <button class="kid-card ${k.id === state.kid ? 'active' : ''}" type="button" data-kid="${k.id}" aria-pressed="${k.id === state.kid ? 'true' : 'false'}">
        <span class="kid-face">${k.face}</span>
        <span><strong>${k.name}</strong><span class="mini">${completedCount(k.id)} 关完成</span></span>
      </button>
    `).join('');
    $('lessonList').innerHTML = `
      ${renderRouteSummary(state.kid, nextIndex)}
      ${renderRouteGroup('入门路线', 'Level 1-3 · 二选一打基础', 'L1', completed, nextIndex)}
      ${renderRouteGroup('进阶路线', 'Level 4-7 · 四选一抗干扰', 'L2', completed, nextIndex)}
    `;
  }

  function renderLearn() {
    clearAutoPlayTimer();
    clearAdvanceTimer();
    const lesson = LESSONS[state.lessonIndex];
    const item = lesson.items[state.itemIndex];
    const pct = ((state.itemIndex) / lesson.items.length) * 100;
    $('lessonTitle').textContent = `${lesson.name}`;
    $('progressText').textContent = `${state.itemIndex + 1}/${lesson.items.length}`;
    $('toolbarProgress').textContent = `${state.itemIndex + 1}/${lesson.items.length}`;
    $('levelPill').textContent = `★ Level ${routeLevelNumber(state.lessonIndex)}`;
    $('starPill').textContent = `★ ${starCount(state.kid)}`;
    $('progressFill').style.width = `${pct}%`;
    const renderChoices = getRenderChoices(item, lesson);
    const choicesContainer = $('choices');
    choicesContainer.className = renderChoices.length === 2 ? 'choices mode-2' : 'choices';
    choicesContainer.innerHTML = renderChoices.map(key => renderChoice(key, key === item.correct)).join('');
    renderPrompt();
    updateAutoPlayControl();
    state.locked = false;
    show('learnScreen', '听句子选图片');
  }

  function startLesson(lessonIndex) {
    state.lessonIndex = lessonIndex;
    state.itemIndex = 0;
    state.sessionErrors = new Set();
    renderLearn();
    scheduleAutoPlay();
  }

  function renderPrompt() {
    const item = LESSONS[state.lessonIndex].items[state.itemIndex];
    const sentence = item.sentence;
    $('englishHintBtn').textContent = `英文提示：${state.englishHint ? '开' : '关'}`;
    $('chineseHintBtn').textContent = `中文提示：${state.chineseHint ? '开' : '关'}`;
    $('englishHintBtn').classList.toggle('active', state.englishHint);
    $('chineseHintBtn').classList.toggle('active', state.chineseHint);
    $('promptPanel').classList.toggle('visible', state.englishHint || state.chineseHint);
    $('englishPrompt').textContent = state.englishHint ? sentence : '';
    $('chinesePrompt').textContent = state.chineseHint ? item.zh : '';
  }

  function renderChoice(key, correct) {
    if (GENERATED_IMAGES[key]) {
      return `
        <button class="choice" type="button" data-correct="${correct ? '1' : '0'}" data-visual="${key}" aria-label="图片选项">
          <img class="choice-img" src="${GENERATED_IMAGES[key]}" alt="">
        </button>
      `;
    }
    const v = VISUALS[key] || VISUALS.apple_red;
    return `
      <button class="choice" type="button" data-correct="${correct ? '1' : '0'}" data-visual="${key}" aria-label="图片选项">
        <div class="scene ${v[0]}">
          <span class="shape one"></span><span class="shape two"></span>
          <span class="main">${v[1]}</span>
          <span class="sub ${v[3] || ''}">${v[2]}</span>
        </div>
      </button>
    `;
  }

  function choiceCountForLesson(lesson) {
    return lesson.choiceCount === 2 ? 2 : 4;
  }

  function choiceModeLabel(lesson) {
    const count = choiceCountForLesson(lesson);
    return count === 2
      ? { stage: '入门', mode: '二选一' }
      : { stage: '进阶', mode: '四选一' };
  }

  function routeLevelNumber(index) {
    return index + 1;
  }

  function routeCycleLabel(index) {
    return ['新内容', '强化', '混合复习', '场景练习', '挑战复习'][index % 5];
  }

  function nextLessonIndexForKid(kid) {
    const completed = completedLessonIds(kid);
    const nextIndex = LESSONS.findIndex(lesson => !completed.has(lesson.id));
    return nextIndex === -1 ? LESSONS.length - 1 : nextIndex;
  }

  function renderRouteSummary(kid, nextIndex) {
    const kidName = KIDS.find(k => k.id === kid)?.name || '小朋友';
    const done = completedCount(kid);
    const nextLesson = LESSONS[nextIndex];
    const nextLabel = nextLesson ? `下一关：Level ${routeLevelNumber(nextIndex)} · ${nextLesson.name}` : '已经完成全部关卡';
    return `
      <div class="route-summary">
        <div class="route-summary-head">
          <strong>${kidName} 的听力路线</strong>
          <span>${done}/${LESSONS.length} 关完成</span>
        </div>
        ${renderStageProgress(kid)}
        <div class="route-next">${nextLabel}</div>
      </div>
    `;
  }

  function renderRouteGroup(title, detail, level, completed, nextIndex) {
    return `
      <div class="route-group">
        <div class="route-group-title">
          <strong>${title}</strong>
          <span>${detail}</span>
        </div>
        ${LESSONS.map((lesson, index) => ({ lesson, index }))
          .filter(entry => entry.lesson.level === level)
          .map(({ lesson, index }) => renderLessonCard(lesson, index, completed, nextIndex))
          .join('')}
      </div>
    `;
  }

  function renderLessonCard(lesson, index, completed, nextIndex) {
    const done = completed.has(lesson.id);
    const choiceLabel = choiceModeLabel(lesson);
    const current = index === nextIndex && !done;
    return `
      <button class="lesson-card ${done ? 'done' : ''} ${current ? 'current' : ''}" type="button" data-lesson="${index}">
        <span>
          <small>Level ${routeLevelNumber(index)} · ${routeCycleLabel(index)}</small>
          <strong>${lesson.name}</strong>
          <span>${choiceLabel.stage} · ${choiceLabel.mode} · ${lesson.items.length} 句${done ? ' · 已完成' : current ? ' · 下一关' : ''}</span>
        </span>
        <span class="lesson-badge">${done ? '✓' : routeLevelNumber(index)}</span>
      </button>
    `;
  }

  function getRenderChoices(item, lesson) {
    const count = choiceCountForLesson(lesson);
    if (count >= 4) return shuffle(item.choices);

    const wrongChoices = shuffle(item.choices.filter(key => key !== item.correct));
    return shuffle([item.correct, ...wrongChoices.slice(0, count - 1)]);
  }

  function playSentence() {
    clearAutoPlayTimer();
    const lesson = LESSONS[state.lessonIndex];
    const sentence = lesson.items[state.itemIndex].sentence;
    $('wave').classList.remove('idle');
    stopCurrentAudio();
    $('wave').classList.remove('idle');
    playLocalAudio(sentence);
  }

  function sentenceAudioSrc(sentence) {
    const slug = sentence.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    return `./audio/sentences/${slug}.wav`;
  }

  function playLocalAudio(sentence) {
    currentAudio = new Audio(sentenceAudioSrc(sentence));
    currentAudio.playbackRate = Math.max(0.75, Math.min(1.2, state.speed / 0.82));
    currentAudio.onended = () => $('wave').classList.add('idle');
    currentAudio.onerror = () => {
      currentAudio = null;
      playWithBrowserVoice(sentence);
    };
    currentAudio.play().catch(() => {
      currentAudio = null;
      playWithBrowserVoice(sentence);
    });
  }

  function prepareVoices() {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.getVoices();
    voicesReady = true;
  }

  function playWithBrowserVoice(sentence, retried = false) {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
      setTimeout(() => $('wave').classList.add('idle'), 900);
      return;
    }
    prepareVoices();
    if (!retried && window.speechSynthesis.getVoices().length === 0) {
      setTimeout(() => playWithBrowserVoice(sentence, true), 180);
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(sentence);
    const en = pickLearningVoice();
    if (en) utter.voice = en;
    utter.lang = 'en-US';
    utter.rate = state.speed;
    utter.pitch = 1.04;
    utter.onend = () => $('wave').classList.add('idle');
    utter.onerror = () => $('wave').classList.add('idle');
    window.speechSynthesis.speak(utter);
  }

  function pickLearningVoice() {
    const voices = window.speechSynthesis.getVoices() || [];
    const profileId = localStorage.getItem(storageKey('voiceProfile')) || DEFAULT_VOICE_PROFILE;
    const names = VOICE_PROFILES[profileId] || VOICE_PROFILES[DEFAULT_VOICE_PROFILE];
    return names
      .map(name => voices.find(voice => voice.name.toLowerCase().includes(name.toLowerCase())))
      .find(Boolean) || voices.find(voice => /^en-US/i.test(voice.lang)) || voices.find(voice => /^en/i.test(voice.lang)) || null;
  }

  function answer(btn) {
    if (state.locked) return;
    const ok = btn.dataset.correct === '1';
    btn.classList.add(ok ? 'correct' : 'wrong');
    if (!ok) {
      btn.disabled = true;
      const item = LESSONS[state.lessonIndex].items[state.itemIndex];
      state.sessionErrors.add(item.id);
      recordMistake();
      playSentence();
      return;
    }
    state.locked = true;
    setChoicesLocked(true);
    stopPracticeFlow();
    addStar(state.kid);
    $('starPill').textContent = `★ ${starCount(state.kid)}`;
    advanceTimer = setTimeout(() => {
      advanceTimer = null;
      nextItem();
    }, CONFIG.NEXT_QUESTION_DELAY);
  }

  function setChoicesLocked(locked) {
    document.querySelectorAll('#choices .choice').forEach(choice => {
      choice.disabled = locked;
    });
  }

  function nextItem() {
    const lesson = LESSONS[state.lessonIndex];
    if (state.itemIndex < lesson.items.length - 1) {
      state.itemIndex += 1;
      renderLearn();
      scheduleAutoPlay(CONFIG.NEXT_AUDIO_DELAY);
      return;
    }
    completeLesson();
  }

  function completeLesson() {
    stopPracticeFlow();
    const lesson = LESSONS[state.lessonIndex];
    const errorCount = state.sessionErrors.size;
    const data = progress();
    data[state.kid] = data[state.kid] || {};
    data[state.kid][lesson.id] = new Date().toISOString().slice(0, 10);
    writeJSON(storageKey('progress'), data);
    $('progressFill').style.width = '100%';
    renderCompleteResult(lesson, errorCount);
    show('completeScreen', '完成一关');
  }

  function renderCompleteResult(lesson, errorCount) {
    const kidName = KIDS.find(k => k.id === state.kid)?.name || '小朋友';
    const label = choiceModeLabel(lesson);
    const isLastLesson = state.lessonIndex >= LESSONS.length - 1;
    $('completeMeta').innerHTML = `
      <span class="result-chip ${lesson.level === 'L1' ? 'starter' : ''}">${label.stage}</span>
      <span class="result-chip">${label.mode}</span>
      <span class="result-chip">${errorCount === 0 ? '全对' : `${errorCount} 个复习点`}</span>
    `;
    $('completeText').textContent = `${kidName} 今天完成了 ${lesson.name}，听了 ${lesson.items.length} 句话。`;
    $('completeFeedback').textContent = resultFeedback(lesson, errorCount);
    $('retryLessonBtn').classList.toggle('hidden', errorCount === 0);
    $('retryLessonBtn').classList.toggle('primary', errorCount > 0);
    $('retryLessonBtn').classList.toggle('secondary', errorCount === 0);
    $('nextLessonBtn').classList.toggle('hidden', isLastLesson);
    $('nextLessonBtn').classList.toggle('primary', errorCount === 0);
    $('nextLessonBtn').classList.toggle('secondary', errorCount > 0);
    $('homeBtn').textContent = isLastLesson ? '回到路线页' : '回首页';
  }

  function resultFeedback(lesson, errorCount) {
    if (errorCount === 0) return '太棒啦！全部一次听对。';
    if (lesson.level === 'L1') return `顺利过关！${errorCount} 个小点再听一遍就更稳。`;
    return `成功挑战四选一！${errorCount} 个复习点说明小耳朵正在升级。`;
  }

  function recordMistake() {
    const lesson = LESSONS[state.lessonIndex];
    const item = lesson.items[state.itemIndex];
    const list = mistakes();
    list.unshift({
      kid: state.kid,
      lesson: lesson.id,
      questionId: item.id,
      sentence: item.sentence,
      date: new Date().toISOString().slice(0, 10)
    });
    writeJSON(storageKey('mistakes'), list.slice(0, 80));
  }

  function isLessonDone(kid, lessonId) {
    return completedLessonIds(kid).has(lessonId);
  }

  function completedCount(kid) {
    return completedLessonIds(kid).size;
  }

  function mistakeCount(kid) {
    return mistakes().filter(item => item.kid === kid).length;
  }

  function latestMistake(kid) {
    return mistakes().find(item => item.kid === kid) || null;
  }

  function latestCompletion(kid) {
    const entries = Object.entries(completedLessonMap(kid));
    if (!entries.length) return null;
    return entries.sort((a, b) => b[1].localeCompare(a[1]))[0];
  }

  function completedLessonMap(kid) {
    const data = progress()[kid];
    if (!data || typeof data !== 'object' || Array.isArray(data)) return {};
    return Object.fromEntries(
      Object.entries(data).filter(([lessonId, date]) =>
        typeof lessonId === 'string' && typeof date === 'string'
      )
    );
  }

  function completedLessonIds(kid) {
    return new Set(Object.keys(completedLessonMap(kid)));
  }

  function stageProgress(kid) {
    const completed = completedLessonIds(kid);
    return [
      {
        id: 'starter',
        name: '入门阶段',
        mode: '二选一 · 基础听音辨识',
        lessons: LESSONS.filter(lesson => lesson.level === 'L1')
      },
      {
        id: 'advanced',
        name: '进阶阶段',
        mode: '四选一 · 抗干扰辨析',
        lessons: LESSONS.filter(lesson => lesson.level === 'L2')
      }
    ].map(stage => {
      const total = stage.lessons.length;
      const done = stage.lessons.filter(lesson => completed.has(lesson.id)).length;
      return {
        ...stage,
        total,
        done,
        percent: total ? Math.round((done / total) * 100) : 0
      };
    });
  }

  function renderStageProgress(kid) {
    return `
      <div class="stage-progress">
        ${stageProgress(kid).map(stage => `
          <div class="stage-row">
            <div class="stage-copy">
              <strong>${stage.name}</strong>
              <span>${stage.mode}</span>
            </div>
            <div class="stage-bar" aria-label="${stage.name}完成度 ${stage.percent}%">
              <div class="stage-fill" style="width: ${stage.percent}%"></div>
            </div>
            <div class="stage-count">${stage.done}/${stage.total}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function questionStageInfo(mistake) {
    const questionId = mistake?.questionId;
    const sentence = mistake?.sentence;
    for (const lesson of LESSONS) {
      const found = lesson.items.find(item =>
        (questionId && item.id === questionId) ||
        (!questionId && sentence && item.sentence === sentence)
      );
      if (found) {
        return lesson.level === 'L1'
          ? { label: '入门', cssClass: 'tag-l1' }
          : { label: '进阶', cssClass: 'tag-l2' };
      }
    }
    return { label: '历史', cssClass: 'tag-old' };
  }

  function renderMistakeTitle(mistake) {
    const stage = questionStageInfo(mistake);
    return `
      <div class="mistake-title">
        <strong>${mistake?.sentence || '暂无'}</strong>
        <span class="mistake-tag ${stage.cssClass}">${stage.label}</span>
      </div>
    `;
  }

  function lessonName(lessonId) {
    return LESSONS.find(lesson => lesson.id === lessonId)?.name || lessonId;
  }

  function shortDate(date) {
    if (!date) return '还没有';
    const [, month, day] = date.match(/^(\d{4})-(\d{2})-(\d{2})$/) || [];
    return month && day ? `${Number(month)}/${Number(day)}` : date;
  }

  function starCount(kid) {
    return Number(stars()[kid] || 0);
  }

  function addStar(kid) {
    const data = stars();
    data[kid] = starCount(kid) + 1;
    writeJSON(storageKey('stars'), data);
  }

  function renderParent() {
    const allMistakes = mistakes();
    const totalDone = KIDS.reduce((sum, kid) => sum + completedCount(kid.id), 0);
    const totalStars = KIDS.reduce((sum, kid) => sum + starCount(kid.id), 0);
    const recentMistakes = allMistakes.slice(0, 5);
    $('parentStats').innerHTML = `
      <div class="parent-header">
        <div>
          <h2>学习概览</h2>
          <p>查看孩子进度、错题和最近需要复习的句子。</p>
        </div>
      </div>
      <div class="parent-summary">
        <div class="summary-tile"><strong>${totalDone}/${KIDS.length * LESSONS.length}</strong><span>总完成关卡</span></div>
        <div class="summary-tile"><strong>★ ${totalStars}</strong><span>累计星星</span></div>
        <div class="summary-tile"><strong>${allMistakes.length}</strong><span>错题记录</span></div>
      </div>
      ${KIDS.map(k => {
        const done = completedCount(k.id);
        const latestDone = latestCompletion(k.id);
        const lastMistake = latestMistake(k.id);
        return `
          <div class="kid-report">
            <div class="kid-report-head"><strong>${k.face} ${k.name}</strong><span>${done === LESSONS.length ? '已完成全部' : '进行中'}</span></div>
            <div class="metric-grid">
              <div class="metric"><strong>${done}/${LESSONS.length}</strong><span>完成关卡</span></div>
              <div class="metric"><strong>★ ${starCount(k.id)}</strong><span>星星</span></div>
              <div class="metric"><strong>${mistakeCount(k.id)}</strong><span>错题</span></div>
            </div>
            ${renderStageProgress(k.id)}
            <div class="mistake-item">
              <strong>最近完成：${latestDone ? lessonName(latestDone[0]) : '暂无'}</strong>
              <span>${latestDone ? shortDate(latestDone[1]) : '先完成一关后这里会更新。'}</span>
            </div>
            <div class="mistake-item">
              ${lastMistake ? renderMistakeTitle(lastMistake) : '<strong>最近错题：暂无</strong>'}
              <span>${lastMistake ? `${lessonName(lastMistake.lesson)} · ${shortDate(lastMistake.date)}` : '暂时没有错题记录。'}</span>
            </div>
          </div>
        `;
      }).join('')}
      <div class="parent-section-title">最近错题</div>
      <div class="mistake-list">
        ${recentMistakes.length ? recentMistakes.map(item => `
          <div class="mistake-item">
            ${renderMistakeTitle(item)}
            <span>${KIDS.find(k => k.id === item.kid)?.name || item.kid} · ${lessonName(item.lesson)} · ${shortDate(item.date)}</span>
          </div>
        `).join('') : '<div class="empty-note">目前没有错题。继续保持，完成练习后这里会自动记录。</div>'}
      </div>
    `;
    show('parentScreen', '家长');
  }

  function shuffle(arr) {
    const items = [...arr];
    for (let index = items.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
    }
    return items;
  }

  document.addEventListener('click', event => {
    if (!voicesReady) prepareVoices();
    const kid = event.target.closest('[data-kid]');
    if (kid) {
      state.kid = kid.dataset.kid;
      renderHome();
      return;
    }
    const lesson = event.target.closest('[data-lesson]');
    if (lesson) {
      startLesson(Number(lesson.dataset.lesson));
      return;
    }
    const choice = event.target.closest('.choice');
    if (choice) answer(choice);
  });

  $('playBtn').addEventListener('click', playSentence);
  $('replayBtn').addEventListener('click', playSentence);
  $('autoPlayBtn').addEventListener('click', () => {
    state.autoPlay = !state.autoPlay;
    writeJSON(storageKey('autoPlay'), state.autoPlay);
    updateAutoPlayControl();
    if (state.autoPlay && $('learnScreen').classList.contains('active')) {
      scheduleAutoPlay();
    } else {
      clearAutoPlayTimer();
    }
  });
  $('exitBtn').addEventListener('click', () => { stopPracticeFlow(); renderHome(); show('homeScreen'); });
  $('learnBackBtn').addEventListener('click', () => { stopPracticeFlow(); renderHome(); show('homeScreen'); });
  $('homeBtn').addEventListener('click', () => { stopPracticeFlow(); renderHome(); show('homeScreen'); });
  $('retryLessonBtn').addEventListener('click', () => startLesson(state.lessonIndex));
  $('nextLessonBtn').addEventListener('click', () => {
    stopPracticeFlow();
    const nextIndex = state.lessonIndex + 1;
    if (nextIndex >= LESSONS.length) {
      renderHome();
      show('homeScreen');
      return;
    }
    startLesson(nextIndex);
  });
  $('parentBtn').addEventListener('click', () => { stopPracticeFlow(); renderParent(); });
  $('parentBackBtn').addEventListener('click', () => { stopPracticeFlow(); renderHome(); show('homeScreen'); });
  $('englishHintBtn').addEventListener('click', () => { state.englishHint = !state.englishHint; renderPrompt(); });
  $('chineseHintBtn').addEventListener('click', () => { state.chineseHint = !state.chineseHint; renderPrompt(); });
  $('speedSelect').addEventListener('change', event => { state.speed = Number(event.target.value) || 0.82; playSentence(); });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
  renderHome();
})();
</script>
</body>
</html>
