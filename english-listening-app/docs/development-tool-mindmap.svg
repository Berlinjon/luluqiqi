<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">英语听力检测软件开发工具思维导图</title>
  <desc id="desc">围绕儿童英语听力检测软件开发过程的工具链思维导图</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b3b5f" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f5fbff; }
      .line { fill: none; stroke: #8ec9f4; stroke-width: 5; stroke-linecap: round; }
      .center { fill: #2f86df; filter: url(#shadow); }
      .node { filter: url(#shadow); }
      .n1 { fill: #ffffff; stroke: #78bff1; stroke-width: 4; }
      .n2 { fill: #fff8e5; stroke: #f0c85a; stroke-width: 4; }
      .n3 { fill: #ecfff6; stroke: #67c89a; stroke-width: 4; }
      .n4 { fill: #fff0f2; stroke: #ef8c9a; stroke-width: 4; }
      .n5 { fill: #f3efff; stroke: #a993ee; stroke-width: 4; }
      .n6 { fill: #eef7ff; stroke: #7eb9ef; stroke-width: 4; }
      .titleText { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; }
      .subText { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #e8f4ff; }
      .nodeTitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 25px; font-weight: 800; fill: #163861; }
      .nodeText { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #35506f; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #60809f; }
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <circle cx="150" cy="130" r="70" fill="#dff2ff"/>
  <circle cx="1260" cy="760" r="90" fill="#e7fff2"/>
  <circle cx="1210" cy="120" r="46" fill="#fff1bd"/>

  <path class="line" d="M700 450 C540 350 420 270 282 205"/>
  <path class="line" d="M700 450 C850 340 955 260 1115 205"/>
  <path class="line" d="M700 450 C520 450 400 450 245 450"/>
  <path class="line" d="M700 450 C900 450 1030 450 1160 450"/>
  <path class="line" d="M700 450 C550 570 440 650 292 705"/>
  <path class="line" d="M700 450 C850 575 960 650 1110 705"/>

  <g>
    <rect class="center" x="520" y="350" rx="36" ry="36" width="360" height="200"/>
    <text class="titleText" x="700" y="422" text-anchor="middle">儿童英语听力</text>
    <text class="titleText" x="700" y="468" text-anchor="middle">检测软件</text>
    <text class="subText" x="700" y="514" text-anchor="middle">学习配套 · 效果检查 · 家庭复习</text>
  </g>

  <g class="node">
    <rect class="n1" x="105" y="105" rx="26" ry="26" width="355" height="205"/>
    <text class="nodeTitle" x="135" y="158">需求与产品定位</text>
    <text class="nodeText" x="135" y="200">洪恩英语课后配套</text>
    <text class="nodeText" x="135" y="233">听句选图检测理解</text>
    <text class="nodeText" x="135" y="266">孩子端 + 家长端</text>
  </g>

  <g class="node">
    <rect class="n2" x="940" y="105" rx="26" ry="26" width="355" height="205"/>
    <text class="nodeTitle" x="970" y="158">AI 协作开发</text>
    <text class="nodeText" x="970" y="200">Codex 读代码与改页面</text>
    <text class="nodeText" x="970" y="233">快速做原型和迭代</text>
    <text class="nodeText" x="970" y="266">本地文件直接落地</text>
  </g>

  <g class="node">
    <rect class="n3" x="80" y="350" rx="26" ry="26" width="360" height="205"/>
    <text class="nodeTitle" x="110" y="403">图片资产生成</text>
    <text class="nodeText" x="110" y="445">gpt-image-2 风格库</text>
    <text class="nodeText" x="110" y="478">儿童插画统一风格</text>
    <text class="nodeText" x="110" y="511">按句子语义配图</text>
  </g>

  <g class="node">
    <rect class="n4" x="960" y="350" rx="26" ry="26" width="360" height="205"/>
    <text class="nodeTitle" x="990" y="403">语音资产生成</text>
    <text class="nodeText" x="990" y="445">Voicebox 本地服务</text>
    <text class="nodeText" x="990" y="478">Kokoro 82M / af_alloy</text>
    <text class="nodeText" x="990" y="511">批量生成 WAV 音频</text>
  </g>

  <g class="node">
    <rect class="n5" x="105" y="620" rx="26" ry="26" width="355" height="205"/>
    <text class="nodeTitle" x="135" y="673">网页应用实现</text>
    <text class="nodeText" x="135" y="715">单文件静态应用</text>
    <text class="nodeText" x="135" y="748">本地进度与错题记录</text>
    <text class="nodeText" x="135" y="781">离线缓存与主屏幕安装</text>
  </g>

  <g class="node">
    <rect class="n6" x="940" y="620" rx="26" ry="26" width="355" height="205"/>
    <text class="nodeTitle" x="970" y="673">测试与复盘</text>
    <text class="nodeText" x="970" y="715">浏览器预览检查</text>
    <text class="nodeText" x="970" y="748">资源缺失与音频校验</text>
    <text class="nodeText" x="970" y="781">从扩题库转向学习检测</text>
  </g>

  <text class="caption" x="700" y="858" text-anchor="middle">工具链不是目标，目标是把孩子每天学过的英文变成可检查、可复习的家庭练习。</text>
</svg>
