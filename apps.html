<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭小应用</title>
<style>
  :root {
    --ink: #18212b;
    --muted: #68737d;
    --line: #dfe7e2;
    --bg: #f7fbf5;
    --card: #fff;
    --green: #2f855a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main {
    width: min(760px, 100%);
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.8rem, 5vw, 3rem);
    letter-spacing: 0;
  }
  p {
    margin: 0 0 22px;
    color: var(--muted);
    font-weight: 700;
    line-height: 1.7;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  .app-card {
    display: grid;
    gap: 10px;
    min-height: 150px;
    padding: 18px;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 14px 34px rgba(27,49,66,.1);
  }
  .app-name {
    display: block;
    font-size: 1.24rem;
    line-height: 1.2;
    font-weight: 900;
    letter-spacing: 0;
  }
  span {
    color: var(--muted);
    font-weight: 700;
    line-height: 1.6;
  }
  b {
    color: var(--green);
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>家庭小应用</h1>
  <p>这里是整理后的入口页。旧链接仍然会自动打开原来的应用。</p>
  <div class="grid">
    <a class="app-card" href="./garden-app/index.html">
      <strong class="app-name">每日花园</strong>
      <span>习惯打卡、积分、奖励和成长记录。</span>
      <b>打开</b>
    </a>
    <a class="app-card" href="./garden-app/luludaka.html">
      <strong class="app-name">Lulu & Qiqi 好习惯</strong>
      <span>保留原来的双人每日好习惯页面，旧首页仍可直接打开。</span>
      <b>打开</b>
    </a>
    <a class="app-card" href="./english-listening-app/index.html">
      <strong class="app-name">英语启蒙听力复习</strong>
      <span>儿童英语听力启蒙，听一句英文短句，自动播放并选择对应图片。</span>
      <b>打开</b>
    </a>
  </div>
</main>
</body>
</html>
