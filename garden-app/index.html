<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fff8ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日花园">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v2.png">
<title>每日花园 🌱</title>
<style>
:root {
  --cream: #fff8ed;
  --cream-dark: #fef0d0;
  --warm-green: #2a6900;
  --warm-green-light: #e8f5d0;
  --warm-green-mid: #84c840;
  --gold: #f7b500;
  --gold-light: #fff3c0;
  --lulu: #e05a8a;
  --lulu-light: #fde8f0;
  --lulu-mid: #f5b8d0;
  --qiqi: #1a9cc8;
  --qiqi-light: #daf2fc;
  --qiqi-mid: #90d8f0;
  --mimi: #8e6bd8;
  --mimi-light: #eee4ff;
  --mimi-mid: #c6b1ff;
  --on-surface: #2c1f00;
  --text-mid: #7a6038;
  --text-light: #b09060;
  --card-bg: #ffffff;
  --shadow-sm: 0 2px 12px rgba(44,31,0,0.07);
  --shadow-md: 0 6px 28px rgba(44,31,0,0.10);
  --shadow-lg: 0 16px 48px rgba(44,31,0,0.14);
  --card-border: rgba(44,31,0,0.08);
  --card-border-strong: rgba(44,31,0,0.12);
  --card-soft-bg: linear-gradient(180deg,rgba(255,255,255,0.98),rgba(255,248,237,0.96));
  --card-soft-fill: #fffdf8;
  --card-subtle-fill: #fff7e8;
  --radius-sm: 16px;
  --radius-md: 24px;
  --radius-lg: 32px;
  --radius-xl: 40px;
  --accent: var(--lulu);
  --accent-light: var(--lulu-light);
  --accent-mid: var(--lulu-mid);
  --header-stack-top: 92px;
  --identity-stick-top: 148px;
  --selector-compact-top: 80px;
}
body.kid-qiqi {
  --accent: var(--qiqi);
  --accent-light: var(--qiqi-light);
  --accent-mid: var(--qiqi-mid);
}
body.kid-mimi {
  --accent: var(--mimi);
  --accent-light: var(--mimi-light);
  --accent-mid: var(--mimi-mid);
}

/* ── 夜间模式 (跟随系统) ── */
@media (prefers-color-scheme: dark) {
  :root {
    --cream: #1e1510;
    --cream-dark: #2a1e14;
    --warm-green: #7ec84a;
    --warm-green-light: #1e2e10;
    --warm-green-mid: #a0d060;
    --gold: #e8a800;
    --gold-light: #2e2408;
    --on-surface: #f0e0c8;
    --text-mid: #c8a878;
    --text-light: #8a6848;
    --card-bg: #261a10;
    --shadow-sm: 0 2px 12px rgba(0,0,0,0.35);
    --shadow-md: 0 6px 28px rgba(0,0,0,0.45);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.55);
    --card-border: rgba(240,224,200,0.10);
    --card-border-strong: rgba(240,224,200,0.16);
    --card-soft-bg: linear-gradient(180deg,rgba(38,26,16,0.98),rgba(30,21,16,0.96));
    --card-soft-fill: #2a1e14;
    --card-subtle-fill: #312215;
    /* kid 颜色在深色下略微提亮 */
    --lulu: #f07aaa;
    --lulu-light: #2e1020;
    --lulu-mid: #a04060;
    --qiqi: #3abce8;
    --qiqi-light: #0a1e2e;
    --qiqi-mid: #1878a0;
    --mimi: #a88bf0;
    --mimi-light: #1a1030;
    --mimi-mid: #6040b0;
  }
  body {
    background: var(--cream);
    color: var(--on-surface);
  }
  /* header 背景 */
  header {
    background: rgba(30,21,16,0.92);
    border-bottom-color: rgba(232,168,0,0.15);
  }
  /* 选择器 */
  #charSelector {
    background: rgba(38,26,16,0.96);
    border-color: rgba(232,168,0,0.15);
  }
  /* 导航栏 */
  nav {
    background: rgba(30,21,16,0.95);
    border-top-color: rgba(232,168,0,0.12);
  }
  /* 卡片类 */
  .tv-card, .wallet-card, .super-card, .growth-card,
  .study-card, .heatmap-card, .stats-card, .store-header-card,
  .beanstalk-wrapper, .map-header {
    background: var(--card-bg);
    border-color: rgba(232,168,0,0.12);
  }
  /* 习惯项目 */
  .habit-item { background: var(--card-bg); }
  .habit-item.done { background: #1a2810; border-color: #3a5820; }
  .habit-item.missed { background: #2a1010; border-color: #6a2020; }
  /* 按钮 */
  .habit-btn { background: #2a1e14; }
  /* 输入框 */
  .growth-input, .edit-text {
    background: #2a1e14;
    border-color: #3a2a1a;
    color: var(--on-surface);
  }
  /* 编辑弹层 */
  .edit-box, .store-edit-box, .toast-box {
    background: #261a10;
    color: var(--on-surface);
  }
  .edit-overlay { background: rgba(0,0,0,0.75); }
  /* 超级挑战卡 */
  .super-card { background: linear-gradient(135deg,#241800,#1e1400); border-color: #604800; }
  .super-item { background: #2a1e10; }
  /* 进度地图 */
  #progress-view .map-header { background: var(--card-bg); }
  /* 所有弹层 */
  .toast-overlay { background: rgba(0,0,0,0.7); }
  /* 备份提醒 */
  #backupReminder { background: #2a1800; border-color: #804000; color: #e8a060; }
  /* 豌豆树 */
  .beanstalk-wrapper { background: linear-gradient(to bottom,#1a2810,#141e0c); border-color: #2a4018; }
  /* store item */
  .store-item { background: var(--card-bg); }
  .store-item.can-afford { background: #1a2810; }
  /* 热力图 */
  .heatmap-day { background: #2a1e14; }
  .heatmap-day.done { background: var(--warm-green); }
  /* tv track */
  .tv-track { background: #1a1008; }
  /* 密码输入框 */
  #pwdInput, #storeConfirmPwd {
    background: #2a1e14;
    color: var(--on-surface);
    border-color: #3a2a1a;
  }
  /* 成长表格 */
  .growth-table th, .growth-table td { border-color: #3a2a1a; }
  /* selector menu */
  .selector-menu { background: rgba(38,26,16,0.98); }
  .selector-option { background: var(--card-bg); }
  .selector-option.active { background: var(--cream-dark); }
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  height:100%;
  height:-webkit-fill-available;
}
body{
  min-height:100vh;
  min-height:-webkit-fill-available;
  min-height:100dvh;
  background:var(--cream);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--on-surface);
  overflow-x:hidden;
  touch-action:manipulation;
  padding-bottom:100px;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));
}

/* ── Decorative BG ── */
.bg-blobs{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.25;animation:blobFloat 12s ease-in-out infinite;}
.blob-1{width:320px;height:320px;background:var(--warm-green-mid);top:-80px;left:-80px;animation-delay:0s;}
.blob-2{width:280px;height:280px;background:var(--gold);top:30%;right:-100px;animation-delay:3s;}
.blob-3{width:240px;height:240px;background:var(--accent);bottom:10%;left:-60px;animation-delay:6s;}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(20px,-20px) scale(1.05);}66%{transform:translate(-15px,15px) scale(0.97);}};

/* ── Header ── */
header{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:block;
  padding:12px 20px 10px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:rgba(255,248,237,0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1.5px solid rgba(247,181,0,0.18);
  box-shadow:0 8px 24px rgba(44,31,0,0.04);
}
.header-shell{display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto;}
.header-topline,.header-bottomline{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.header-logo{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,var(--warm-green),var(--warm-green-mid));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:var(--shadow-sm);
}
.header-branding{min-width:0;}
.header-eyebrow{
  font-size:0.64rem;font-weight:900;color:var(--text-light);
  letter-spacing:0.16em;text-transform:uppercase;
}
.header-page-title{
  margin-top:2px;
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:1.2rem;
  color:var(--on-surface);letter-spacing:-0.4px;line-height:1.05;
}
.header-date{
  font-size:0.72rem;color:var(--text-mid);font-weight:700;
  margin-top:1px;text-align:right;white-space:nowrap;
}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.header-meta-pill{
  display:inline-flex;align-items:center;gap:6px;
  max-width:100%;
  padding:6px 12px;border-radius:999px;
  background:linear-gradient(135deg,var(--accent-light),rgba(255,255,255,0.94));
  border:1.5px solid var(--accent-mid);
  box-shadow:var(--shadow-sm);
  font-size:0.76rem;font-weight:900;color:var(--on-surface);
}

.streak-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--gold-light);border:1.5px solid var(--gold);
  border-radius:999px;padding:5px 12px;
  font-size:0.82rem;font-weight:900;color:#a07000;
}
@keyframes spin{to{transform:rotate(360deg);}};

/* ── Collapsible Kid Selector ── */
#charSelector{
  position:sticky;top:calc(var(--header-stack-top) + env(safe-area-inset-top));z-index:40;
  padding:12px 16px;
  background:rgba(255,248,237,0.9);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(247,181,0,0.08);
  transition:padding 0.22s ease, background 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
}
.selector-toggle{
  width:100%;border:1.5px solid color-mix(in srgb, var(--accent-mid) 65%, white 35%);border-radius:18px;padding:12px 14px;
  background:linear-gradient(135deg,var(--accent-light),rgba(255,255,255,0.98));box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  transition:padding 0.22s ease, border-radius 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease, background 0.22s ease, border-color 0.22s ease;
}
.selector-current{display:flex;align-items:center;gap:10px;min-width:0;}
.selector-mini-ring{width:46px;height:46px;position:relative;flex-shrink:0;}
.selector-mini-ring svg{width:46px;height:46px;display:block;}
.selector-mini-ring b{
  position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;
  font-size:0.68rem;font-weight:900;color:var(--text-mid);
}
.selector-main-text{min-width:0;text-align:left;}
.selector-name{font-size:0.95rem;font-weight:900;line-height:1.1;color:var(--on-surface);}
.selector-sub{font-size:0.74rem;font-weight:800;color:var(--text-mid);margin-top:2px;}
.selector-arrow{font-size:1rem;color:var(--text-mid);transition:transform .22s ease;}
#charSelector.open .selector-arrow{transform:rotate(180deg);}
.selector-menu{
  display:none;margin-top:10px;padding:10px;background:rgba(255,255,255,0.98);
  border-radius:18px;box-shadow:var(--shadow-sm);border:1.5px solid var(--card-border);
}
#charSelector.open .selector-menu{display:flex;gap:8px;}
.selector-option{
  flex:1;min-width:0;border:1.5px solid transparent;border-radius:16px;background:var(--card-soft-fill);
  padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.selector-option.active{transform:translateY(-1px);}
.selector-option .opt-name{font-size:0.84rem;font-weight:900;}
.selector-option .opt-sub{font-size:0.72rem;font-weight:800;color:var(--text-mid);}
.selector-option[data-kid="lulu"].active{border-color:var(--lulu);background:var(--lulu-light);}
.selector-option[data-kid="qiqi"].active{border-color:var(--qiqi);background:var(--qiqi-light);}
.selector-option[data-kid="mimi"].active{border-color:var(--mimi);background:var(--mimi-light);}
#charSelector.compact{
  position:fixed;
  top:calc(var(--selector-compact-top) + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:min(calc(100% - 24px), 560px);
  padding:6px 0 0;
  background:transparent;
  box-shadow:none;
  z-index:46;
}
#charSelector.compact .selector-toggle{
  padding:8px 11px;
  border-radius:999px;
  background:rgba(255,255,255,0.96);
  box-shadow:0 10px 24px rgba(44,31,0,0.12);
}
#charSelector.compact .selector-current{gap:7px;}
#charSelector.compact .selector-mini-ring{width:32px;height:32px;}
#charSelector.compact .selector-mini-ring svg{width:32px;height:32px;}
#charSelector.compact .selector-mini-ring b{font-size:0.54rem;}
#charSelector.compact .selector-name{font-size:0.86rem;line-height:1;}
#charSelector.compact .selector-sub{display:none;}
#charSelector.compact .selector-arrow{font-size:0.82rem;}
#charSelector.compact .selector-menu{margin-top:8px;}

/* ── Main Content ── */
main{position:relative;z-index:1;padding:0 16px;max-width:560px;margin:0 auto;}
.kid-panel{display:none;}
.kid-panel.active{display:block;}
.kid-panel,
#progress-view,
#rewards-view{
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transform:translateZ(0);
  -webkit-transform:translateZ(0);
  will-change:transform,opacity;
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}};

.kid-identity-bar{
  position:sticky;top:calc(var(--identity-stick-top) + env(safe-area-inset-top));z-index:28;
  display:flex;align-items:center;gap:10px;
  margin:8px 0 12px;padding:8px 12px;
  border-radius:14px;
  background:rgba(255,255,255,0.72);
  border:1px solid rgba(44,31,0,0.05);
  box-shadow:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0.92;
}
.kid-identity-bar.kid-lulu{
  background:rgba(253,232,240,0.74);
  border-color:rgba(242,168,196,0.45);
}
.kid-identity-bar.kid-qiqi{
  background:rgba(228,245,254,0.76);
  border-color:rgba(143,207,234,0.44);
}
.kid-identity-bar.kid-mimi{
  background:rgba(240,233,255,0.76);
  border-color:rgba(201,182,242,0.46);
}
.kid-identity-emoji{
  width:32px;height:32px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.08rem;
  background:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.85);
  flex-shrink:0;
}
.kid-identity-bar.kid-lulu .kid-identity-emoji{
  background:#fff6fa;
  box-shadow:inset 0 0 0 1px #f7c7d9, 0 4px 10px rgba(224,90,138,0.10);
}
.kid-identity-bar.kid-qiqi .kid-identity-emoji{
  background:#f4fbff;
  box-shadow:inset 0 0 0 1px #b9e2f4, 0 4px 10px rgba(26,156,200,0.10);
}
.kid-identity-bar.kid-mimi .kid-identity-emoji{
  background:#faf7ff;
  box-shadow:inset 0 0 0 1px #d7caf8, 0 4px 10px rgba(142,107,216,0.10);
}
.kid-identity-text{min-width:0;}
.kid-identity-label{
  font-size:0.62rem;font-weight:900;color:var(--text-mid);
  letter-spacing:0.35px;text-transform:uppercase;
}
.kid-identity-bar.kid-lulu .kid-identity-label{color:#b44f74;}
.kid-identity-bar.kid-qiqi .kid-identity-label{color:#2f7da0;}
.kid-identity-bar.kid-mimi .kid-identity-label{color:#7256b6;}
.kid-identity-name{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:0.92rem;font-weight:900;color:var(--on-surface);line-height:1.1;
}
body.is-old-iphone .kid-identity-bar{top:128px;padding:7px 10px;}
.kid-home-group{
  margin:0 0 18px;
  padding:14px 14px 12px;
  border-radius:20px;
  border:1.5px solid rgba(44,31,0,0.07);
  box-shadow:var(--shadow-sm);
}
.kid-home-group.tasks{
  background:linear-gradient(180deg,rgba(255,255,255,0.96),rgba(255,248,237,0.94));
}
.kid-home-group.feedback{
  background:linear-gradient(180deg,#f6fbf1,rgba(255,255,255,0.96));
  border-color:rgba(114,168,52,0.14);
}
.kid-home-group.review{
  background:linear-gradient(180deg,#fffdf7,rgba(255,255,255,0.97));
  border-color:rgba(232,168,0,0.14);
}
.kid-home-group-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  margin-bottom:12px;
}
.kid-home-group-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:1rem;font-weight:900;color:var(--on-surface);line-height:1.1;
}
.kid-home-group-sub{
  margin-top:3px;
  font-size:0.72rem;font-weight:700;color:var(--text-mid);line-height:1.45;
}
.kid-home-group-tag{
  flex-shrink:0;
  border-radius:999px;
  padding:4px 10px;
  font-size:0.66rem;font-weight:900;letter-spacing:0.35px;
  text-transform:uppercase;
}
.kid-home-group-copy-kid{display:none;}
.kid-home-group.tasks .kid-home-group-tag{
  background:#fff0d0;color:#a07000;
}
.kid-home-group.feedback .kid-home-group-tag{
  background:#e8f5e9;color:#2e7d32;
}
.kid-home-group.review .kid-home-group-tag{
  background:#fff8dc;color:#8d6e00;
}
.kid-home-group .section-title:first-of-type{margin-top:0;}
.yesterday-review-card{
  margin:0 0 14px;
  padding:14px 14px 12px;
  border-radius:18px;
  background:linear-gradient(180deg,#fff8e8,rgba(255,255,255,0.98));
  border:1.5px solid rgba(247,181,0,0.26);
  box-shadow:var(--shadow-sm);
}
.yesterday-review-card.hidden{display:none;}
.yesterday-review-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
.yesterday-review-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:0.95rem;font-weight:900;color:#8d6e00;
}
.yesterday-review-summary{
  margin-top:4px;
  font-size:0.82rem;font-weight:700;color:var(--on-surface);line-height:1.5;
}
.yesterday-review-meta{
  margin-top:8px;
  font-size:0.72rem;font-weight:700;color:var(--text-mid);line-height:1.45;
}
.yesterday-review-actions{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.yesterday-review-btn{
  border:none;border-radius:999px;padding:7px 12px;
  font-size:0.72rem;font-weight:900;font-family:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.yesterday-review-btn.toggle{
  background:#fff3cd;color:#8d6e00;
}
.yesterday-review-btn.dismiss{
  background:transparent;color:#a1887f;padding:4px 6px;font-size:0.88rem;
}
.yesterday-review-detail{
  margin-top:10px;padding-top:10px;border-top:1px dashed rgba(247,181,0,0.28);
  display:none;
}
.yesterday-review-card.open .yesterday-review-detail{display:block;}
.yesterday-review-grid{
  display:grid;gap:8px;
}
.yesterday-review-item{
  background:rgba(255,255,255,0.82);
  border-radius:14px;
  padding:10px 12px;
}
.yesterday-review-item-label{
  font-size:0.68rem;font-weight:900;color:var(--text-mid);letter-spacing:0.3px;text-transform:uppercase;
}
.yesterday-review-item-text{
  margin-top:4px;
  font-size:0.8rem;font-weight:700;color:var(--on-surface);line-height:1.5;
}
.yesterday-review-encourage{
  margin-top:8px;
  font-size:0.78rem;font-weight:800;color:#5d8a24;
}
body.is-old-iphone #charSelector.compact{
  top:calc(var(--selector-compact-top) + env(safe-area-inset-top));
  width:min(calc(100% - 20px), 560px);
}

/* ── Section Title ── */
.section-title{
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:1rem;
  color:var(--text-mid);letter-spacing:0.5px;text-transform:uppercase;
  margin:20px 0 10px;display:flex;align-items:center;gap:6px;
}
.section-title::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--accent);display:inline-block;}

/* ── Hero Progress Card ── */
.hero-card{
  margin-top:12px;
  background:var(--card-bg);border-radius:var(--radius-lg);
  padding:24px 20px;box-shadow:var(--shadow-md);
  border:1.5px solid rgba(247,181,0,0.15);
  display:flex;align-items:center;gap:20px;
  position:relative;overflow:hidden;
}
.hero-card::before{
  content:'';position:absolute;right:-40px;top:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,var(--accent-light),transparent 70%);
  pointer-events:none;
}
.hero-ring-wrap{position:relative;flex-shrink:0;}
.hero-ring{width:88px;height:88px;}
.hero-ring-inner{
  position:absolute;top:8px;right:8px;bottom:8px;left:8px;border-radius:50%;
  background:var(--cream);display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}

.hero-pct-label{font-size:0.6rem;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:0.5px;}
.hero-info{flex:1;}
