<main>
  <a href="./index.html">返回语文小探险</a>
  <h1>隐私政策</h1>
  <p>更新日期：2026-05-20</p>
  <section>
    <h2>我们收集什么</h2>
    <p>当前版本不要求注册登录，不主动收集孩子姓名、手机号、头像、定位等个人信息。学习进度、星星、错字本、连续学习天数保存在浏览器本地。</p>
  </section>
  <section>
    <h2>数据如何使用</h2>
    <p>本地学习数据仅用于展示学习进度、生成家长报告、推荐下一课和复习内容。当前版本不会把这些数据上传到服务器。</p>
  </section>
  <section>
    <h2>家长控制</h2>
    <p>家长可以在“家长进度”中清空本机学习记录。清空后，已完成课程、星星和错字本会从当前浏览器删除。</p>
  </section>
  <section>
    <h2>第三方能力</h2>
    <p>笔顺动画使用公开的汉字笔顺前端能力；正式商业发布前，应完成第三方依赖许可核查、内容版权核查和应用商店要求的合规材料。</p>
  </section>
</main>
